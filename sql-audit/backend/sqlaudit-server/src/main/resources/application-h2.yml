# H2 平台库（无 Docker 的测试方言，MODE=PostgreSQL）。激活：SPRING_PROFILES_ACTIVE=h2
spring:
  datasource:
    url: jdbc:h2:mem:sqlaudit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: sqlaudit-h2-pool

  flyway:
    enabled: true
    # H2 方言迁移（23 表 + 创世块 + 4 角色种子）
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
