# 公共配置 + 命名组合（profile group）。
# 启动用 SPRING_PROFILES_ACTIVE=<组名>，组名 = 环境 + 方言，一个词搞定：
#   dev-home    = dev + mysql     在家开发（MySQL 本机）
#   dev-company = dev + postgres  公司开发（PG，地址走 SQLAUDIT_PG_URL 注入）
#   test        = test + postgres 公司测试（PG test 库）
#   prod        = prod + postgres 公司生产（PG prod 库）
# 也可直接手写组合：SPRING_PROFILES_ACTIVE=dev,mysql / dev,postgres / test,h2 …
spring:
  profiles:
    group:
      dev-home: [dev, mysql]
      dev-company: [dev, postgres]
      test: [test, postgres]
      prod: [prod, postgres]
  flyway:
    enabled: false            # memory 默认方言无库，禁用 Flyway；mysql/postgres/h2 方言各自启用

server:
  port: 8080

logging:
  level:
    com.sqlaudit: INFO
