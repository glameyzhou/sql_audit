# 服务端自动化测试专用 profile（契约 §4.1）：MySQL 方言 + 独立测试库 sql_audit_it，
# 执行循环关闭。任何测试都不得连接开发库 sql-audit。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sql_audit_it?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: sqlaudit-it-pool

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: false

sqlaudit:
  worker:
    enabled: false   # 测试只装配 worker bean、不启动执行循环（执行循环用例单独打开开关）
