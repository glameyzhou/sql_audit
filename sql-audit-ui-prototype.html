<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 审核平台 · 交互设计稿 | 极星动力</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#F8FAFD; --surface3:#EEF2F8;
  --border:#E2E8F2; --border2:#CBD5E5;
  --text:#14213D; --text2:#5A6B88; --text3:#8A99B2;
  --brand:#17315E; --brand2:#0FA8B7; --brand-soft:#E6F6F8;
  --ok:#15A06A; --ok-soft:#E6F6EE; --warn:#D9860B; --warn-soft:#FDF3E0;
  --danger:#DC3C47; --danger-soft:#FDECEE; --info:#3568D4; --info-soft:#EAF1FD;
  --purple:#7651C8; --purple-soft:#F0EBFB;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 8px 24px rgba(20,33,61,.06);
  --shadow-lg:0 12px 48px rgba(20,33,61,.16);
  --radius:10px; --radius-sm:7px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0A1120; --surface:#111B2E; --surface2:#16223A; --surface3:#1C2A44;
  --border:#243352; --border2:#35476B;
  --text:#E8EFFA; --text2:#95A7C2; --text3:#6B7E9C;
  --brand:#6E9BFF; --brand2:#35D6CE; --brand-soft:#123043;
  --ok:#3FCF8E; --ok-soft:#12362C; --warn:#F0B44A; --warn-soft:#3A2C14;
  --danger:#F46B75; --danger-soft:#3A1A22; --info:#7AA5FF; --info-soft:#16294C;
  --purple:#A98AF0; --purple-soft:#261F42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 12px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text2)} .dim{color:var(--text3)}
.nowrap{white-space:nowrap}
.flex{display:flex} .between{display:flex;justify-content:space-between;align-items:center}
.center{display:flex;align-items:center} .wrap{flex-wrap:wrap}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:228px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .18s ease}
.sidebar.collapsed{width:64px}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);flex:none;overflow:hidden}
.brand-mark{width:30px;height:30px;flex:none;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 3px 10px rgba(15,168,183,.28)}
.brand-mark svg{width:17px;height:17px}
.brand-txt{white-space:nowrap;overflow:hidden}
.brand-name{font-weight:700;font-size:13.5px;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--text3);letter-spacing:.5px}
.nav{flex:1;overflow-y:auto;padding:10px 8px 16px}
.nav-group{font-size:10px;color:var(--text3);letter-spacing:1.2px;font-weight:600;padding:14px 10px 6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;white-space:nowrap;position:relative;margin-bottom:2px;transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface3);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
[data-theme="dark"] .nav-item.active{color:var(--brand2)}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand2)}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav-badge.soft{background:var(--surface3);color:var(--text2)}
.side-foot{padding:10px;border-top:1px solid var(--border);flex:none}
.side-foot .kv{font-size:11px;color:var(--text3)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px}
.crumb{font-size:12px;color:var(--text3);white-space:nowrap}
.crumb b{color:var(--text);font-weight:600}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text2);display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--surface3);color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.icon-btn .dot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface)}
.searchbox{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text3);min-width:190px;cursor:pointer}
.searchbox:hover{border-color:var(--border2)}
.searchbox svg{width:14px;height:14px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border2);border-radius:4px;padding:1px 5px;color:var(--text3);background:var(--surface)}
.seg{display:flex;background:var(--surface3);border-radius:var(--radius-sm);padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--text2);padding:4px 10px;border-radius:5px;font-size:11.5px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.content{flex:1;overflow-y:auto;padding:22px 24px 40px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:16px}
.page-title{font-size:19px;font-weight:700;letter-spacing:-.2px}
.page-desc{font-size:12px;color:var(--text2);margin-top:3px}

/* ---------- atoms ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);gap:12px}
.card-t{font-weight:650;font-size:13px}
.card-sub{font-size:11px;color:var(--text3);margin-top:2px}
.card-b{padding:16px}
.card-b.tight{padding:0}
.btn{height:32px;padding:0 13px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--brand2);color:var(--brand2)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2);border-color:var(--brand2);color:#fff}
[data-theme="dark"] .btn-primary{background:var(--brand);border-color:var(--brand);color:#08101F}
.btn-accent{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn-accent:hover{opacity:.88;color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{opacity:.88;color:#fff}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--surface3)}
.btn-sm{height:26px;padding:0 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:10.5px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)} .b-info{background:var(--info-soft);color:var(--info)}
.b-brand{background:var(--brand-soft);color:var(--brand2)} .b-purple{background:var(--purple-soft);color:var(--purple)}
.b-neutral{background:var(--surface3);color:var(--text2)}
.dot-s{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--surface3);color:var(--text2);white-space:nowrap}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.stat .lbl{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.stat .val{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .foot{font-size:10.5px;color:var(--text3)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.split-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.split,.split-r{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:600;color:var(--text3);font-size:10.5px;letter-spacing:.5px;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface2)}
.row-title{font-weight:600;color:var(--text)}
.row-sub{font-size:10.5px;color:var(--text3);margin-top:1px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--text2)}
.input,.select,.textarea{width:100%;border:1px solid var(--border2);background:var(--surface);border-radius:var(--radius-sm);padding:7px 10px;outline:none;font-size:12px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
.textarea{resize:vertical;min-height:80px;line-height:1.6}
.sql-editor{font-family:var(--mono);font-size:12.5px;line-height:1.7;min-height:210px;background:var(--surface2);tab-size:2}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-size:12px;color:var(--text2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand2);border-bottom-color:var(--brand2)}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:var(--radius-sm);font-size:11.5px;line-height:1.6}
.notice svg{width:15px;height:15px;flex:none;margin-top:2px}
.n-info{background:var(--info-soft);color:var(--info)} .n-warn{background:var(--warn-soft);color:var(--warn)}
.n-danger{background:var(--danger-soft);color:var(--danger)} .n-ok{background:var(--ok-soft);color:var(--ok)}
.n-neutral{background:var(--surface3);color:var(--text2)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:6px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text3);white-space:nowrap} .kv .v{font-weight:600;text-align:right}
.progress{height:6px;border-radius:4px;background:var(--surface3);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:4px;background:var(--brand2);transition:width .4s ease}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .nm{width:80px;font-size:11px;color:var(--text2);flex:none}
.bar-row .bar{flex:1;height:8px;border-radius:5px;background:var(--surface3);overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:5px}
.bar-row .num{width:34px;text-align:right;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.stepbar{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 0}
.step{display:flex;align-items:center;gap:7px;flex:none;font-size:10.5px;color:var(--text3)}
.step .cir{width:20px;height:20px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--text3);flex:none}
.step.done .cir{background:var(--ok-soft);color:var(--ok)} .step.done{color:var(--ok)}
.step.cur .cir{background:var(--brand2);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)} .step.cur{color:var(--brand2);font-weight:700}
.step-line{width:22px;height:1px;background:var(--border2);flex:none;margin:0 6px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--border)}
.tl-item{position:relative;padding:0 0 14px 0}
.tl-item::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--border2)}
.tl-item.hi::before{border-color:var(--brand2);background:var(--brand2)}
.tl-t{font-size:11.5px;font-weight:600} .tl-m{font-size:10.5px;color:var(--text3);margin-top:1px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:38px 16px;color:var(--text3);text-align:center}
.empty svg{width:34px;height:34px;opacity:.5}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;background:var(--surface3);font-size:11px;color:var(--text2);cursor:pointer;border:1px solid transparent}
.chip:hover{border-color:var(--border2)} .chip.on{background:var(--brand-soft);color:var(--brand2);border-color:var(--brand2);font-weight:600}
.switch{width:32px;height:18px;border-radius:10px;background:var(--border2);position:relative;border:0;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--brand2)} .switch.on::after{left:16px}
.checkline{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:11.5px;border-bottom:1px dashed var(--border)}
.checkline:last-child{border-bottom:0}
.checkline .ic{width:15px;height:15px;flex:none;margin-top:1px}
.unit-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;background:var(--surface2);margin-bottom:9px}
.unit-card.running{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
.unit-card.confirm{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.result-table{font-family:var(--mono);font-size:11.5px}
.result-table td{padding:7px 12px}
.mask{color:var(--purple);font-weight:600;letter-spacing:1px}
.sql-line{font-family:var(--mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.hl-kw{color:var(--purple);font-weight:700} .hl-str{color:var(--ok)} .hl-danger{color:var(--danger);font-weight:700}
.divider{height:1px;background:var(--border);margin:14px 0}
.section-t{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.8px;margin:16px 0 9px}

/* ---------- query workbench / admin ---------- */
:root{--mysql:#3B82F6;--pg:#6366F1;--iot:#0FA8B7}
[data-theme="dark"]{--mysql:#7AA5FF;--pg:#A5B4FC;--iot:#35D6CE}
.query-layout{display:grid;grid-template-columns:236px 280px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1280px){.query-layout{grid-template-columns:210px minmax(0,1fr)}.query-mid{display:none}}
.db-item{display:flex;gap:9px;padding:10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;margin-bottom:5px}
.db-item:hover{background:var(--surface2)}
.db-item.on{background:var(--brand-soft);border-color:var(--brand2)}
.db-item .ty{width:4px;align-self:stretch;border-radius:3px;flex:none}
.db-item .nm{font-weight:650;font-size:12px}
.db-item .meta{font-size:10px;color:var(--text3);margin-top:2px}
.type-badge{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.t-MySQL{background:rgba(59,130,246,.13);color:var(--mysql)}
.t-PostgreSQL{background:rgba(99,102,241,.13);color:var(--pg)}
.t-IoTDB{background:rgba(15,168,183,.13);color:var(--iot)}
.tree-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:11.5px}
.tree-item:hover{background:var(--surface2)}
.tree-item.on{background:var(--brand-soft);color:var(--brand2);font-weight:600}
.tree-item svg{width:12px;height:12px;flex:none}
.editor-wrap{position:relative}
.hint-pop{position:absolute;left:12px;top:38px;z-index:20;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:190px;max-height:190px;overflow:auto}
.hint-pop .hi-item{padding:6px 10px;font-family:var(--mono);font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.hint-pop .hi-item:hover{background:var(--brand-soft)}
.hint-pop .hi-item .k{color:var(--text3);font-size:10px}
.lint-bar{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:var(--radius-sm);font-size:11px;margin-top:8px;line-height:1.5}
.lint-ok{background:var(--ok-soft);color:var(--ok)} .lint-warn{background:var(--warn-soft);color:var(--warn)} .lint-err{background:var(--danger-soft);color:var(--danger)}
.perm-cell{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11px;white-space:nowrap}
.perm-y{color:var(--ok)} .perm-n{color:var(--text3)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.scope-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;background:var(--surface2)}
.scope-card .lvl{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--text3)}
.flow-node{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:16px;background:var(--brand-soft);color:var(--brand2);font-size:11px;font-weight:600;white-space:nowrap}
.flow-arrow{color:var(--text3);font-size:11px}
.inherit{font-size:10px;color:var(--text3);font-style:italic}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check-opt{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.check-opt.on{border-color:var(--brand2);background:var(--brand-soft);color:var(--brand2);font-weight:600}

/* ---------- overlays ---------- */
.mask-layer{position:fixed;inset:0;background:rgba(10,18,35,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:86vh;overflow:auto}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-t{font-size:14px;font-weight:700}
.modal-b{padding:18px}
.modal-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.drawer-wrap{position:fixed;inset:0;z-index:45;display:flex;justify-content:flex-end}
.drawer-bg{position:absolute;inset:0;background:rgba(10,18,35,.35)}
.drawer{position:relative;width:min(600px,94vw);height:100%;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.drawer-h{padding:15px 18px;border-bottom:1px solid var(--border);flex:none}
.drawer-b{flex:1;overflow:auto;padding:18px}
.drawer-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex:none}
#toast-root{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--brand2);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:10px 14px;min-width:240px;max-width:380px;font-size:12px;animation:toastIn .2s ease}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--danger)}
.toast b{display:block;margin-bottom:2px}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.cmd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.cmd:hover{background:var(--surface2)}
.fade{animation:fadeIn .22s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.4s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.footer-note{text-align:center;color:var(--text3);font-size:10.5px;padding:26px 0 6px}

/* ---------------- helpers ---------------- */
function typeBadge(t){return '<span class="type-badge t-'+t+'">'+t+'</span>';}
function typeColor(t){return t==='MySQL'?'var(--mysql)':t==='PostgreSQL'?'var(--pg)':'var(--iot)';}
function dbName(id){const d=DBS.find(x=>x.id===id);return d?d.name:id;}
function chainHtml(c){return c.map((n,i)=>(i?'<span class="flow-arrow"> → </span>':'')+'<span class="flow-node">'+esc(n)+'</span>').join('');}
function badge(map,key){const v=map[key]||['b-neutral',key];return '<span class="badge '+v[0]+'">'+v[1]+'</span>';}
function toast(title,msg,kind){const id=++S.toastSeq;const el=document.createElement('div');el.className='toast '+(kind||'');el.innerHTML='<b>'+esc(title)+'</b><span class="muted">'+esc(msg||'')+'</span>';document.getElementById('toast-root').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(6px)';el.style.transition='.25s';setTimeout(()=>el.remove(),260);},3600);}
function openModal(cfg){S.modal=cfg;paintModal();}
function closeModal(){S.modal=null;paintModal();}
function paintModal(){
  const r=document.getElementById('modal-root');
  if(!S.modal){r.innerHTML='';return;}
  const m=S.modal;
  r.innerHTML='<div class="mask-layer" data-close="1"><div class="modal"><div class="modal-h"><div class="modal-t">'+m.title+'</div><button class="icon-btn" data-close="1">'+ic('x')+'</button></div><div class="modal-b">'+(m.body||'')+'</div><div class="modal-f">'+(m.actions||'<button class="btn" data-close="1">关闭</button>')+'</div></div></div>';
}
function openDrawer(id){S.drawerTicket=id;paintDrawer();}
function closeDrawer(){S.drawerTicket=null;paintDrawer();}
function statCard(lbl,val,foot,color,icon){
  return '<div class="card stat"><div class="lbl">'+ic(icon,13)+esc(lbl)+'</div><div class="val" style="color:'+(color||'var(--text)')+'">'+val+'</div><div class="foot">'+esc(foot||'')+'</div></div>';
}
function cardHead(t,sub,right){return '<div class="card-h"><div><div class="card-t">'+t+'</div>'+(sub?'<div class="card-sub">'+sub+'</div>':'')+'</div>'+(right||'')+'</div>';}

/* 原型用正则做演示；真实实现必须走 AST（见设计文档 §4.2）。
   这里先剥掉字符串字面量与注释，否则 `WHERE remark='update'` 或表名 update_log 会误判为写操作。 */
function stripLiterals(s){
  return s.replace(/'(?:[^']|'')*'/g,"''")      // 单引号字符串
          .replace(/"(?:[^"]|"")*"/g,'""')      // 双引号标识符/字符串
          .replace(/`[^`]*`/g,'``')             // MySQL 反引号标识符
          .replace(/--[^\n]*/g,' ')             // 行注释
          .replace(/\/\*[\s\S]*?\*\//g,' ');    // 块注释
}
function lintSql(sql){
  const raw=(sql||'').trim();
  if(!raw) return {lv:'warn',msg:'编辑器为空，输入 SELECT 语句开始查询'};
  if((raw.match(/'/g)||[]).length%2) return {lv:'err',msg:'语法错误：字符串引号未闭合'};
  const s=stripLiterals(raw);
  if(/(^|[\s(;])(insert|update|delete|drop|alter|truncate|create|grant|call|lock)[\s(]/i.test(' '+s+' ')||/explain\s+analyze|for\s+update|for\s+share|into\s+outfile|into\s+dumpfile|lock\s+in\s+share/i.test(s))
    return {lv:'err',msg:'只读判定不通过：检测到写操作或危险子句，执行将降级为审核工单'};
  if(!/^(select|with|show|explain)\b/i.test(s)) return {lv:'err',msg:'无法识别为只读语句（解析失败一律高危，不放行）'};
  if(!/limit\s+\d+/i.test(s)) return {lv:'warn',msg:'未写 LIMIT：执行时按 AST 注入 LIMIT 1000（不做字符串拼接）'};
  return {lv:'ok',msg:'语法校验通过 · 只读白名单内 · 超时 10s · 结果掩码已启用'};
}

function effectiveFlow(dbId,risk){
  if(risk==='CRITICAL') return {src:'全局 L3（不可覆盖）',chain:['主管','DBA','管理员']};
  const ov=(FLOW_DB[dbId]||[]).find(f=>f.cond===risk);
  if(ov) return {src:'实例级覆盖 L2 · '+dbName(dbId)+'（加严）',chain:ov.chain};
  const g=FLOW_GLOBAL.find(f=>f.cond===risk);
  return {src:'继承全局默认 L1',chain:g?g.chain:['自动通过']};
}

function startExec(){
  const e=S.execution;
  e.units=[
    {i:1,inst:'prod-order-mysql',schema:'order_db',sql:'UPDATE orders SET status=2 WHERE …',st:'pending',lease:'—',intent:false,exec:false},
    {i:2,inst:'prod-order-mysql',schema:'order_db',sql:'INSERT INTO order_archive …',st:'pending',lease:'—',intent:false,exec:false},
    {i:3,inst:'prod-user-pg',schema:'user_db',sql:'ALTER TABLE users ADD COLUMN …',st:'pending',lease:'—',intent:false,exec:false}
  ];
  e.step=0;e.running=true;e.confirmPending=false;go('execution');
  const seq=['leased','executing','success'];
  const timer=setInterval(()=>{
    const u=e.units[e.step];
    if(!u){clearInterval(timer);return;}
    const idx=seq.indexOf(u.st);
    if(idx<0)u.st='leased';else if(u.st!=='success')u.st=seq[Math.min(idx+1,2)];
    if(u.st==='leased'){u.lease='worker-02';}
    if(u.st==='executing'){u.intent=true;}
    if(u.st==='success'){
      u.exec=true;u.lease='worker-02';
      if(e.step===2&&!e.confirmPending){
        e.confirmPending=true;u.st='needs_confirm';clearInterval(timer);e.running=false;paint();
        openModal({title:'人工确认 · needs_confirm',
          body:'<div class="notice n-danger">'+ic('alert',15)+'<div><b>生产库 SQL 可能已生效，但平台库状态未确认。</b><br>按幂等协议，此单元已冻结自动重试，需人工核对后定态。</div></div>'+
            '<div class="section-t">现场信息</div>'+
            '<div class="kv"><span class="k">unit</span><span class="v mono">TK-1042 / unit#3</span></div>'+
            '<div class="kv"><span class="k">intent_written</span><span class="v">1（已预写）</span></div>'+
            '<div class="kv"><span class="k">executed_at</span><span class="v" style="color:var(--danger)">NULL</span></div>'+
            '<div class="kv"><span class="k">binlog 区间</span><span class="v mono">mysql-bin.00412:8912 → :9044</span></div>'+
            '<div class="notice n-neutral" style="margin-top:12px">'+ic('info',15)+'<div>核对生产库实际状态后再选择；选「确认已执行」会按 unit_id 幂等写回 succeeded，<b>不会重新执行 SQL</b>。</div></div>',
          actions:'<button class="btn" data-close="1">稍后处理</button><button class="btn btn-danger" data-act="confirm-fail">标记失败</button><button class="btn btn-primary" data-act="confirm-ok">确认已执行</button>'});
        return;
      }
      e.step++;
    }
    paint();
    if(e.step>=e.units.length){clearInterval(timer);e.running=false;paint();toast('执行完成','3 / 3 unit 已幂等确认','ok');}
  },850);
}
function doQuery(){
  const q=S.query;q.phase='running';q.blocked=false;paint();
  const danger=/explain\s+analyze|for\s+update|into\s+outfile|lock\s+in\s+share/i.test(q.sql);
  setTimeout(()=>{q.phase='done';q.blocked=danger;paint();toast(danger?'查询被拦截':'查询完成',danger?'非只读语句已降级为审核工单':'返回 5 行 · 128ms',danger?'err':'ok');},650);
}

    case 'db-filter':{S.dbFilter=el.dataset.v;paint();break;}
    case 'db-new':case 'db-edit':{openDbModal(act==='db-edit'?el.dataset.v:null);break;}
    case 'db-save':{closeModal();toast('数据库已保存','接入校验：binlog / 只读副本 / 防火墙白名单','ok');break;}
    case 'db-perm':{S.permDraft={user:'许昭',db:el.dataset.v,query:true,change:false,approve:false,admin:false,expire:'2027-02-28',reason:''};openPermModal('实例授权 · '+dbName(el.dataset.v));break;}
    case 'perm-new':{S.permDraft={user:'许昭',db:'db_order',query:true,change:false,approve:false,admin:false,expire:'2027-02-28',reason:''};openPermModal('新增授权');break;}
    case 'perm-edit':{const p=PERMS[+el.dataset.v];S.permDraft={user:p.user,db:p.db,query:p.query,change:p.change,approve:p.approve,admin:p.admin,expire:p.expire,reason:''};openPermModal('编辑授权 · '+p.user);break;}
    case 'perm-toggle':{S.permDraft[el.dataset.v]=!S.permDraft[el.dataset.v];paintModal();break;}
    case 'perm-save':{const d=S.permDraft;PERMS.push({user:d.user,db:d.db,query:d.query,change:d.change,approve:d.approve,admin:d.admin,expire:d.expire,by:'管理员'});closeModal();paint();toast('授权已生效',d.user+' × '+dbName(d.db)+' · 已写审计 PERM_GRANT','ok');break;}
    case 'perm-revoke':{const i=+el.dataset.v;const p=PERMS[i];openModal({title:'回收权限',body:'<div class="notice n-danger">'+ic('alert',15)+'<div>确认回收 <b>'+esc(p.user)+'</b> 在 <b>'+esc(dbName(p.db))+'</b> 的权限？回收即时生效，并写入审计日志。</div></div>',actions:'<button class="btn" data-close="1">取消</button><button class="btn btn-danger" data-act="perm-revoke-ok" data-v="'+i+'">确认回收</button>'});break;}
    case 'perm-revoke-ok':{PERMS.splice(+el.dataset.v,1);closeModal();paint();toast('权限已回收','已写审计 PERM_REVOKE','warn');break;}
    case 'flow-scope':{S.flowScope=el.dataset.v;paint();break;}
    case 'flow-add':{openModal({title:'新增审批规则',body:'<div class="form-grid"><div class="field"><label>触发条件</label><select class="select"><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="field"><label>环境</label><select class="select"><option>prod</option><option>staging</option><option>any</option></select></div><div class="field full"><label>审批节点（按顺序）</label><input class="input" value="主管 → DBA → 实例 Owner"></div><div class="field"><label>会签模式</label><select class="select"><option>AND 会签</option><option>OR 或签</option></select></div><div class="field"><label>覆盖策略</label><select class="select"><option>仅允许加严</option><option>不可覆盖</option></select></div></div><div class="notice n-warn" style="margin-top:12px">'+ic('alert',15)+'<div>实例级覆盖只能加严；CRITICAL 与破坏性 DDL 不可覆盖。</div></div>',actions:'<button class="btn" data-close="1">取消</button><button class="btn btn-primary" data-act="flow-save">保存规则</button>'});break;}
    case 'flow-save':{closeModal();toast('审批规则已保存','配置变更已写审计 FLOW_UPDATE','ok');break;}
    case 'q-sample-write':{S.query.sql='DELETE FROM orders WHERE id = 10241873;';S.query.phase='idle';S.query.hint=[];paint();break;}
    case 'hint-pick':{S.query.sql=S.query.sql.replace(/([A-Za-z_][A-Za-z0-9_.]*)$/,el.dataset.v);S.query.hint=[];const ta=document.querySelector('[data-sql]');if(ta)ta.value=S.query.sql;const hp=document.getElementById('hint-pop');if(hp)hp.innerHTML='';const lb=document.getElementById('lint-bar');if(lb){const l=lintSql(S.query.sql);lb.className='lint-bar lint-'+l.lv;lb.innerHTML=ic(l.lv==='ok'?'check':l.lv==='warn'?'alert':'x',13)+'<span>'+l.msg+'</span>';}break;}
    case 'open-cmd':openCmd();break;
  }
}
function openDbModal(id){
  const d=id?DBS.find(x=>x.id===id):{name:'',type:'MySQL',ver:'8.0',env:'prod',host:'',owner:'陈默',desc:''};
  S.dbDraft=Object.assign({},d);
  openModal({title:id?'编辑数据库 · '+d.name:'新建数据库',
    body:'<div class="form-grid">'+
      '<div class="field"><label>名称</label><input class="input" data-bind="dbDraft.name" value="'+esc(d.name)+'" placeholder="如：订单主库"></div>'+
      '<div class="field"><label>类型</label><select class="select" data-bind="dbDraft.type">'+['MySQL','PostgreSQL','IoTDB'].map(t=>'<option'+(d.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>版本</label><input class="input" data-bind="dbDraft.ver" value="'+esc(d.ver)+'"></div>'+
      '<div class="field"><label>环境</label><select class="select" data-bind="dbDraft.env"><option'+(d.env==='prod'?' selected':'')+'>prod</option><option'+(d.env==='staging'?' selected':'')+'>staging</option></select></div>'+
      '<div class="field full"><label>连接地址 host:port</label><input class="input mono" data-bind="dbDraft.host" value="'+esc(d.host)+'" placeholder="10.30.1.12:3306"></div>'+
      '<div class="field"><label>实例 Owner</label><select class="select" data-bind="dbDraft.owner">'+USERS.map(u=>'<option'+(d.owner===u.name?' selected':'')+'>'+u.name+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>凭据</label><input class="input" placeholder="AES-GCM 加密存储，不回显"></div>'+
      '<div class="field full"><label>用途说明</label><input class="input" data-bind="dbDraft.desc" value="'+esc(d.desc)+'"></div>'+
    '</div>'+
    '<div class="notice n-info" style="margin-top:12px">'+ic('shield',15)+'<div>保存后自动接入校验：只读副本连通性、binlog 格式（ROW/FULL/保留期）、防火墙白名单；三类账号按最小权限创建。</div></div>',
    actions:'<button class="btn" data-close="1">取消</button><button class="btn btn-primary" data-act="db-save">保存并校验</button>'});
}
function openPermModal(title){
  const d=S.permDraft;
  const opt=(k,label,warn)=>'<div class="check-opt '+(d[k]?'on':'')+'" data-act="perm-toggle" data-v="'+k+'">'+ic(d[k]?'check':'plus',13)+label+(warn?' <span class="dim">（需二次确认）</span>':'')+'</div>';
  openModal({title:title,
    body:'<div class="form-grid">'+
      '<div class="field"><label>授权用户</label><select class="select" data-bind="permDraft.user">'+USERS.map(u=>'<option value="'+u.name+'"'+(d.user===u.name?' selected':'')+'>'+u.name+' · '+u.role+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>目标实例</label><select class="select" data-bind="permDraft.db">'+DBS.map(x=>'<option value="'+x.id+'"'+(d.db===x.id?' selected':'')+'>'+esc(x.name)+' · '+x.type+'</option>').join('')+'<option value="*"'+(d.db==='*'?' selected':'')+'>全部实例（谨慎）</option></select></div>'+
    '</div>'+
    '<div class="section-t">权限点（按需勾选，最小权限）</div><div class="check-grid">'+opt('query','SQL 查询')+opt('change','SQL 变更',true)+opt('approve','审批权限')+opt('admin','管理权限',true)+'</div>'+
    '<div class="form-grid" style="margin-top:12px"><div class="field"><label>有效期</label><input class="input" data-bind="permDraft.expire" value="'+esc(d.expire)+'"></div><div class="field"><label>授权原因（写审计）</label><input class="input" data-bind="permDraft.reason" placeholder="如：订单归档需求"></div></div>'+
    (d.change||d.admin?'<div class="notice n-danger" style="margin-top:12px">'+ic('alert',15)+'<div>你正在授予<b>高权限</b>（变更 / 管理）。请确认确有必要；该操作将二次确认并写入审计。</div></div>':'<div class="notice n-neutral" style="margin-top:12px">'+ic('info',15)+'<div>仅授予查询权限：用户只能走只读通道，不能提交变更工单。</div></div>'),
    actions:'<button class="btn" data-close="1">取消</button><button class="btn btn-primary" data-act="perm-save">确认授权</button>'});
}
function computeHint(sql){
  const m=(sql||'').match(/([A-Za-z_][A-Za-z0-9_.]*)$/);
  if(!m) return [];
  const w=m[1].toUpperCase();
  if(!w) return [];
  const tbls=(TABLES[S.query.db]||[]).map(t=>t.name);
  return SQL_KW.concat(tbls).filter(k=>k.toUpperCase().indexOf(w)===0&&k.toUpperCase()!==w).slice(0,6);
}
function openCmd(){
  const items=[['overview','工作台'],['submit','提交变更'],['tickets','工单中心'],['approvals','审批中心'],['execution','执行监控'],['rollback','回滚管理'],['query','线上查询'],['audit','审计日志'],['admin','系统配置']];
  openModal({title:'全局搜索 / 快速跳转',
    body:'<div class="notice n-info" style="margin-bottom:10px">'+ic('search',15)+'<div>输入工单号、SQL 关键字或页面名称。⌘K 唤起，Esc 关闭。</div></div>'+items.map(i=>'<div class="cmd" data-act="cmd-go" data-v="'+i[0]+'">'+ic('chev',13)+'<span>'+i[1]+'</span><span class="grow"></span><span class="kbd">↵</span></div>').join(''),
    actions:'<button class="btn" data-close="1">关闭</button>'});
}
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl){const inModal=closeEl.closest('#modal-root');const inDrawer=closeEl.closest('#drawer-root');if(inModal)closeModal();else if(inDrawer)closeDrawer();return;}
  const bindEl=e.target.closest('[data-act="cmd-go"]');
  if(bindEl){closeModal();go(bindEl.dataset.v);return;}
  const actEl=e.target.closest('[data-act]');
  if(actEl){
    // 表单控件（select / input）的 click 不能 preventDefault，否则下拉打不开；
    // 它们的交互走 change 监听器。
    const tag=e.target.tagName;
    if(tag!=='SELECT'&&tag!=='INPUT'&&tag!=='TEXTAREA'){e.preventDefault();handle(actEl.dataset.act,actEl);}
    return;
  }
  const goEl=e.target.closest('[data-go]');
  if(goEl){const t=goEl.dataset.ticket;if(goEl.dataset.tab)S.adminTab=goEl.dataset.tab;go(goEl.dataset.go);if(t)openDrawer(t);return;}
  const tkEl=e.target.closest('[data-ticket]');
  if(tkEl){openDrawer(tkEl.dataset.ticket);return;}
  const auEl=e.target.closest('[data-audit]');
  if(auEl){openModal({title:'审计事件明细',body:'<div class="kv"><span class="k">trace_id</span><span class="v mono">'+auEl.dataset.audit+'</span></div><div class="kv"><span class="k">detail</span><span class="v">加密存储（SQL 摘要 / 前后摘要）</span></div><div class="kv"><span class="k">hash 链</span><span class="v" style="color:var(--ok)">校验通过</span></div><div class="notice n-neutral" style="margin-top:12px">'+ic('lock',15)+'<div>查看完整明文需单独授权，且本次查看本身会写入审计日志。</div></div>',actions:'<button class="btn" data-close="1">关闭</button>'});}
});
document.addEventListener('input',e=>{
  const b=e.target.closest('[data-bind]');
  if(b){setBind(b.dataset.bind,e.target.value);}
  if(b&&b.dataset.sql){
    const l=lintSql(S.query.sql);
    const lb=document.getElementById('lint-bar');
    if(lb){lb.className='lint-bar lint-'+l.lv;lb.innerHTML=ic(l.lv==='ok'?'check':l.lv==='warn'?'alert':'x',13)+'<span>'+l.msg+'</span>';}
    const hp=document.getElementById('hint-pop');
    if(hp){const hs=computeHint(S.query.sql);hp.innerHTML=hs.length?'<div class="hint-pop">'+hs.map(h=>'<div class="hi-item" data-act="hint-pick" data-v="'+esc(h)+'"><span>'+esc(h)+'</span><span class="k">'+(/^[A-Z]/.test(h)?'关键字':'表名')+'</span></div>').join('')+'</div>':'';}
  }
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-bind]');if(b)setBind(b.dataset.bind,e.target.value);
  const fb=e.target.closest('[data-act="flow-db"],[data-act="flow-preview-db"]');if(fb){S.flowDb=fb.value;paint();return;}
  const fr=e.target.closest('[data-act="flow-preview-risk"]');if(fr){S.flowPreviewRisk=fr.value;paint();return;}
  const r=e.target.closest('[data-act="role"]');if(r){S.role=r.value;paint();toast('角色已切换','当前：'+roleName(S.role)+'（用于演示权限差异）');}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.modal)closeModal();else openCmd();}
  if(e.key==='Escape'){if(S.modal)closeModal();else if(S.drawerTicket)closeDrawer();}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&S.view==='submit'){e.preventDefault();doPrecheck();}
});
paint();
</script>
</body>
